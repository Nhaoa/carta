<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma Cartinha Para Você 🐾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Indie+Flower&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-paper: #f4ede1;
      --paper-grid: #ded4c1;
      --charcoal: #2b2725;
      --pencil: #443e3a;
      --pencil-light: #6e645e;
      --amber: #c48b36;
      --amber-soft: #ecd29b;
      --card-bg: #fffdf9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-paper);
      background-image: 
        radial-gradient(circle, var(--paper-grid) 1.2px, transparent 1.2px),
        linear-gradient(to right, rgba(215, 201, 178, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(215, 201, 178, 0.25) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px, 24px 24px;
      font-family: 'Patrick Hand', 'Caveat', cursive, sans-serif;
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      user-select: none;
    }

    /* Tela para as patinhas e corações */
    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Gatinhos espiando nas bordas */
    .border-peeker {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      opacity: 0;
    }
    .border-peeker.left {
      left: -55px;
      top: 35%;
      transform: rotate(90deg);
    }
    .border-peeker.left.active {
      transform: translateX(55px) rotate(90deg);
      opacity: 1;
    }
    .border-peeker.right {
      right: -55px;
      bottom: 30%;
      transform: rotate(-90deg);
    }
    .border-peeker.right.active {
      transform: translateX(-55px) rotate(-90deg);
      opacity: 1;
    }
    .border-peeker.bottom {
      bottom: -55px;
      left: 70%;
      transform: rotate(0deg);
    }
    .border-peeker.bottom.active {
      transform: translateY(-55px) rotate(0deg);
      opacity: 1;
    }

    /* Palco Central */
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
      max-width: 480px;
    }

    /* Balão de Fala do Gatinho */
    .speech-bubble {
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      border-radius: 26px;
      padding: 10px 22px;
      font-size: 1.25rem;
      color: var(--charcoal);
      box-shadow: 3px 4px 0px rgba(43, 39, 37, 0.2);
      margin-bottom: 14px;
      position: relative;
      animation: floatBubble 3s ease-in-out infinite;
      cursor: pointer;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .speech-bubble:active {
      transform: scale(0.96);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 11px 11px 0;
      border-style: solid;
      border-color: var(--charcoal) transparent transparent;
      display: block;
      width: 0;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 9px 0;
      border-style: solid;
      border-color: var(--card-bg) transparent transparent;
      display: block;
      width: 0;
      z-index: 1;
    }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Contentor do Gatinho */
    .cat-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }
    .cat-wrapper:active {
      transform: scale(0.97);
    }

    .cat-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(2px 5px 3px rgba(43, 39, 37, 0.12));
    }

    /* Animação de Carinho / Purr */
    .cat-wrapper.petting {
      animation: catWiggle 0.5s ease-in-out infinite alternate;
    }
    @keyframes catWiggle {
      0% { transform: rotate(-3deg) scale(1.02); }
      100% { transform: rotate(3deg) scale(1.02); }
    }

    /* Botão de Acariciar */
    .pet-btn {
      margin-top: 18px;
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      border-radius: 30px;
      padding: 10px 24px;
      font-size: 1.25rem;
      font-family: inherit;
      color: var(--charcoal);
      cursor: pointer;
      box-shadow: 2px 4px 0px rgba(43, 39, 37, 0.18);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pet-btn:hover {
      background: #faf2e3;
      transform: translateY(-2px);
      box-shadow: 2px 6px 0px rgba(43, 39, 37, 0.2);
    }
    .pet-btn:active {
      transform: translateY(2px);
      box-shadow: 1px 1px 0px rgba(43, 39, 37, 0.2);
    }

    /* Modal / Carta Aberta */
    .letter-modal {
      position: fixed;
      inset: 0;
      background: rgba(36, 32, 29, 0.55);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .letter-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .letter-paper {
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      border-radius: 18px;
      max-width: 420px;
      width: 100%;
      padding: 34px 28px 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
      position: relative;
      transform: translateY(25px) scale(0.92);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      background-image: repeating-linear-gradient(
        var(--card-bg),
        var(--card-bg) 27px,
        rgba(215, 201, 178, 0.4) 28px
      );
      line-height: 28px;
    }
    .letter-modal.open .letter-paper {
      transform: translateY(0) scale(1);
    }

    .letter-stamp {
      position: absolute;
      top: 14px;
      right: 18px;
      width: 44px;
      height: 48px;
      border: 1.5px dashed var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transform: rotate(6deg);
      background: rgba(236, 210, 155, 0.3);
    }

    .letter-text {
      font-family: 'Caveat', cursive;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--charcoal);
      margin-bottom: 24px;
      white-space: pre-line;
      text-align: left;
    }

    .letter-footer {
      font-family: 'Patrick Hand', cursive;
      font-size: 1.15rem;
      color: var(--pencil-light);
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      border-top: 1px dashed var(--amber-soft);
      padding-top: 12px;
    }

    .close-letter-btn {
      position: absolute;
      top: -14px;
      right: -14px;
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      color: var(--charcoal);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    }
    .close-letter-btn:hover {
      background: #f1e4d0;
    }
  </style>
</head>
<body>

  <!-- Canvas das patinhas no fundo -->
  <canvas id="fx-canvas"></canvas>

  <!-- Gatinhos espiando nas bordas -->
  <div class="border-peeker left" id="peeker-left">
    <svg width="70" height="60" viewBox="0 0 100 80">

    <svg width="70" height="60" viewBox="0 0 100 80">
      <path d="M 16,80 L 16,42 L 6,18 L 40,32 Q 50,35 60,32 L 94,18 L 84,42 L 84,80 Z"[cite: 9]
            fill="#fffdf9" stroke="#2b2725" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="37" cy="55" r="14" fill="#2b2725"/>
      <circle cx="67" cy="55" r="14" fill="#2b2725"/>
      <circle cx="41" cy="49" r="4.2" fill="#ffffff"/>
      <circle cx="71" cy="49" r="4.2" fill="#ffffff"/>
      <path d="M 49,69 Q 52,72 55,69" fill="none" stroke="#2b2725" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="border-peeker bottom" id="peeker-bottom">
    <svg width="70" height="60" viewBox="0 0 100 80">
      <path d="M 16,80 L 16,42 L 6,18 L 40,32 Q 50,35 60,32 L 94,18 L 84,42 L 84,80 Z"[cite: 9]
            fill="#fffdf9" stroke="#2b2725" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="37" cy="55" r="14" fill="#2b2725"/>

      <circle cx="41" cy="49" r="4.2" fill="#ffffff"/>
      <circle cx="71" cy="49" r="4.2" fill="#ffffff"/>
      <path d="M 49,69 Q 52,72 55,69" fill="none" stroke="#2b2725" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Cenário Principal -->
  <main class="stage">
    
    <!-- Balão de instrução -->
    <div class="speech-bubble" id="speech-bubble" onclick="openLetter()">
      Psst... toque no gatinho para abrir a cartinha!🐾[cite: 4]
    </div>

    <!-- Gatinho central desenhado a lápis/grafite -->
    <div class="cat-wrapper" id="cat-wrapper" onclick="openLetter()">
      <svg class="cat-svg" viewBox="0 0 200 200">
        <defs>
          <clipPath id="left-eye-clip">
            <ellipse cx="68" cy="98" rx="26" ry="24"/>
          </clipPath>
          <clipPath id="right-eye-clip">
            <ellipse cx="122" cy="98" rx="26" ry="24"/>
          </clipPath>
        </defs>

        <!-- Cauda de grafite -->
        <path d="M 136,155 C 165,152 178,130 170,118 C 163,108 152,118 150,126 C 148,135 140,147 132,154" 
              fill="none" stroke="#2b2725" stroke-width="4" stroke-linecap="round"/>

        <!-- Corpo e patinhas traseiras em arco 'U' arredondadas e contínuas -->
        <path d="M 64,136 
                 C 58,150 56,168 68,172

                 C 142,168 140,150 134,136 Z" 
              fill="#fffdf9" stroke="#2b2725" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- Cabeça com traço de esboço -->
        <path d="M 44,82

                 C 152,38 156,54 152,82 
                 C 160,112 142,138 98,138

              fill="#fffdf9" stroke="#2b2725" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- OLHOS REGULARES -->
        <g id="regular-eyes">
          <ellipse cx="68" cy="98" rx="26" ry="24" fill="#2b2725" stroke="#2b2725" stroke-width="2"/>
          <g clip-path="url(#left-eye-clip)">
            <path d="M 68,93 C 68,90 64,87 61,89 C 58,91 58,95 61,98 L 68,104 L 75,98 C 78,95 78,91 75,89 C 72,87 68,90 68,93 Z" fill="#ffffff"/>

        <!-- ENVELOPE LACRADO -->
        <g id="closed-letter">
          <rect x="70" y="130" width="56" height="38" rx="4" fill="#fffdf9" stroke="#2b2725" stroke-width="3.5"/>
          <path d="M 70,132 L 98,150 L 126,132" fill="none" stroke="#2b2725" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- Patinhas a segurar o envelope -->
        <ellipse cx="69" cy="144" rx="7.5" ry="6.5" fill="#fffdf9" stroke="#2b2725" stroke-width="3"/>

    <!-- Botão de Acariciar -->
    <button class="pet-btn" id="pet-btn" onclick="petTheCat(event)">
      <span>Acariciar o gatinho</span> 🐾

  <!-- Modal com a Carta Aberta -->
  <div class="letter-modal" id="letter-modal">
    <div class="letter-paper">
      <button class="close-letter-btn" onclick="closeLetter()" aria-label="Fechar">✕</button>
      <div class="letter-stamp">💌</div>
      <div class="letter-text" id="letter-content"></div>
      <div class="letter-footer">
        Com todo o meu amor, para você ♡
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1. SAUDAÇÃO DINÂMICA NATURAL E AFETIVA
    ========================================================= */
    function getDynamicGreeting() {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 12) {
        return "Bom dia";
      } else if (hour >= 12 && hour < 18) {
        return "Boa tarde";
      } else if (hour >= 18 && hour < 24) {
        return "Boa noite";
      } else {
        return "Boa madrugada";
      }
    }

    function buildLetterText() {
      const greeting = getDynamicGreeting();
      return `Adoro o seu jeitinho. Seu sorriso me contagia de alegria.\n\n${greeting}, meu pedaço de pecado, te amo!`;
    }

    /* =========================================================
       2. REPRODUÇÃO DE ÁUDIO (ARQUIVO gato_1.mp3 + FALLBACK)
    ========================================================= */
    let catAudio = null;
    try {
      catAudio = new Audio('gato_1.mp3');
    } catch(e) {
      catAudio = null;
    }

    let audioCtx = null;
    function playSynthesizedMeow() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'triangle';
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1600, now);

        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.16);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.55);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.6);
      } catch (err) {}
    }

    function playMeowSound() {
      if (catAudio) {
        catAudio.currentTime = 0;
        catAudio.play().catch(() => {
          playSynthesizedMeow();
        });
      } else {
        playSynthesizedMeow();
      }
    }

    function playPaperSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1200;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(now);
      } catch(e) {}
    }

    /* =========================================================
       3. INTERAÇÕES
    ========================================================= */
    const letterModal = document.getElementById('letter-modal');
    const letterContent = document.getElementById('letter-content');
    const catWrapper = document.getElementById('cat-wrapper');
    const regularEyes = document.getElementById('regular-eyes');
    const happyEyes = document.getElementById('happy-eyes');

    function openLetter() {
      letterContent.innerText = buildLetterText();
      playPaperSound();
      letterModal.classList.add('open');
      createFloatingHearts(window.innerWidth / 2, window.innerHeight / 2, 12);
    }

    function closeLetter() {
      letterModal.classList.remove('open');
    }

    letterModal.addEventListener('click', (e) => {
      if (e.target === letterModal) closeLetter();
    });

    let petTimeout = null;
    function petTheCat(event) {
      event.stopPropagation();
      playMeowSound();

      regularEyes.style.display = 'none';
      happyEyes.style.display = 'block';
      catWrapper.classList.add('petting');

      const rect = catWrapper.getBoundingClientRect();
      createFloatingHearts(rect.left + rect.width / 2, rect.top + 50, 6);

      clearTimeout(petTimeout);
      petTimeout = setTimeout(() => {
        regularEyes.style.display = 'block';
        happyEyes.style.display = 'none';
        catWrapper.classList.remove('petting');
      }, 1000);
    }

    /* =========================================================
       4. RASTROS DE PATINHAS E CORAÇÕES
    ========================================================= */
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const paws = [];
    const hearts = [];

    function drawPaw(x, y, angle, alpha, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale, scale);
      ctx.fillStyle = `rgba(68, 62, 58, ${alpha})`;

      ctx.beginPath();
      ctx.ellipse(0, 0, 7.5, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      const toes = [
        { dx: -7.5, dy: -8.5, r: 2.8 },
        { dx: -2.8, dy: -11.5, r: 3.2 },
        { dx: 3.2, dy: -11.5, r: 3.2 },
        { dx: 7.8, dy: -8.5, r: 2.8 }
      ];
      toes.forEach(t => {
        ctx.beginPath();
        ctx.arc(t.dx, t.dy, t.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawHeart(x, y, size, alpha, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = color.replace('ALPHA', alpha);
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
      ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, size, 0, size);
      ctx.bezierCurveTo(0, size, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.fill();
      ctx.restore();
    }

    function createFloatingHearts(x, y, count = 5) {
      for (let i = 0; i < count; i++) {
        hearts.push({
          x: x + (Math.random() * 40 - 20),
          y: y + (Math.random() * 20 - 10),
          vx: Math.random() * 2 - 1,
          vy: -(Math.random() * 2 + 1.5),
          size: Math.random() * 12 + 10,
          alpha: 0.9,
          decay: Math.random() * 0.015 + 0.012,
          color: Math.random() > 0.4 ? 'rgba(196, 139, 54, ALPHA)' : 'rgba(68, 62, 58, ALPHA)'
        });
      }
    }

    class PawTrail {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.angle = Math.random() * Math.PI * 2;
        this.stepsLeft = Math.floor(Math.random() * 5) + 4;
        this.stepDist = 24;
        this.side = 1;
        this.delay = Math.random() * 60;
      }
      step() {
        if (this.delay > 0) {
          this.delay--;
          return;
        }
        const lateralDist = 8 * this.side;
        const px = this.x + Math.cos(this.angle + Math.PI / 2) * lateralDist;
        const py = this.y + Math.sin(this.angle + Math.PI / 2) * lateralDist;

        paws.push({
          x: px,
          y: py,
          angle: this.angle + Math.PI / 2,
          alpha: 0.38,
          scale: 0.9 + Math.random() * 0.2
        });

        this.x += Math.cos(this.angle) * this.stepDist;
        this.y += Math.sin(this.angle) * this.stepDist;
        this.angle += (Math.random() * 0.4 - 0.2);
        this.side *= -1;
        this.stepsLeft--;
        this.delay = 18;

        if (this.stepsLeft <= 0 || this.x < -50 || this.x > window.innerWidth + 50 || this.y < -50 || this.y > window.innerHeight + 50) {
          this.reset();
        }
      }
    }

    const trails = [new PawTrail(), new PawTrail(), new PawTrail()];

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      trails.forEach(t => t.step());

      for (let i = paws.length - 1; i >= 0; i--) {
        const p = paws[i];
        drawPaw(p.x, p.y, p.angle, p.alpha, p.scale);
        p.alpha -= 0.0035;
        if (p.alpha <= 0) paws.splice(i, 1);
      }

      for (let i = hearts.length - 1; i >= 0; i--) {
        const h = hearts[i];
        drawHeart(h.x, h.y, h.size, h.alpha, h.color);
        h.x += h.vx;
        h.y += h.vy;
        h.alpha -= h.decay;
        if (h.alpha <= 0) hearts.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }
    animate();

    /* =========================================================
       5. GATINHOS ESPIANDO NAS BORDAS
    ========================================================= */
    const peekers = [
      document.getElementById('peeker-left'),
      document.getElementById('peeker-right'),
      document.getElementById('peeker-bottom')
    ];

    function triggerRandomPeeker() {
      const p = peekers[Math.floor(Math.random() * peekers.length)];
      p.classList.add('active');
      setTimeout(() => {
        p.classList.remove('active');
      }, 2600);

      const nextDelay = Math.random() * 4500 + 3500;
      setTimeout(triggerRandomPeeker, nextDelay);
    }
    setTimeout(triggerRandomPeeker, 2000);
  </script>
</body>
