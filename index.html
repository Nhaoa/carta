<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma Cartinha Para Você 🐾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Indie+Flower&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-paper: #f4ede1;
      --paper-grid: #ded4c1;
      --charcoal: #2b2725;
      --pencil: #443e3a;
      --pencil-light: #6e645e;
      --amber: #c48b36;
      --amber-soft: #ecd29b;
      --card-bg: #fffdf9;
    }

    /* Temas de Horário */
    body.time-morning {
      --bg-paper: #fbf6ec;
      --paper-grid: #e6dcce;
      --charcoal: #2b2725;
      --card-bg: #ffffff;
      --amber: #c88832;
    }
    body.time-afternoon {
      --bg-paper: #f2e7d3;
      --paper-grid: #d9caae;
      --charcoal: #282422;
      --card-bg: #fffaf0;
      --amber: #b87a26;
    }
    body.time-evening {
      --bg-paper: #322d2a;
      --paper-grid: #423c38;
      --charcoal: #f3ece1;
      --pencil-light: #b0a49c;
      --card-bg: #262220;
      --amber: #d89f4b;
    }
    body.time-dawn {
      --bg-paper: #1e1b19;
      --paper-grid: #2c2724;
      --charcoal: #e6ded4;
      --pencil-light: #948b84;
      --card-bg: #151312;
      --amber: #cfa156;
    }

    body.theme-cafe {
      --bg-paper: #eae0d0;
      --paper-grid: #cfc2ad;
      --charcoal: #302621;
      --card-bg: #fdfaf5;
      --amber: #a86c2e;
    }
    body.theme-night {
      --bg-paper: #22252a;
      --paper-grid: #32373e;
      --charcoal: #e8ecf2;
      --pencil-light: #9aa2ae;
      --card-bg: #191c20;
      --amber: #d2a149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-paper);
      background-image: 
        radial-gradient(circle, var(--paper-grid) 1.2px, transparent 1.2px),
        linear-gradient(to right, rgba(120, 110, 100, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(120, 110, 100, 0.1) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px, 24px 24px;
      font-family: 'Patrick Hand', 'Caveat', cursive, sans-serif;
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      user-select: none;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Controles Superiores */
    .top-controls {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .auto-time-toggle, .coin-badge {
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 1.05rem;
      color: var(--charcoal);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .auto-time-toggle:active, .coin-badge:active {
      transform: scale(0.96);
    }
    .auto-time-toggle.active {
      border-color: var(--amber);
      background: #faf4e6;
      color: #2b2725;
    }

    /* Gatinhos espiando nas bordas */
    .border-peeker {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      opacity: 0;
    }
    .border-peeker.left {
      left: -55px;
      top: 35%;
      transform: rotate(90deg);
    }
    .border-peeker.left.active {
      transform: translateX(55px) rotate(90deg);
      opacity: 1;
    }
    .border-peeker.right {
      right: -55px;
      bottom: 30%;
      transform: rotate(-90deg);
    }
    .border-peeker.right.active {
      transform: translateX(-55px) rotate(-90deg);
      opacity: 1;
    }
    .border-peeker.bottom {
      bottom: -55px;
      left: 70%;
      transform: rotate(0deg);
    }
    .border-peeker.bottom.active {
      transform: translateY(-55px) rotate(0deg);
      opacity: 1;
    }

    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
      max-width: 480px;
    }

    .speech-bubble {
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      border-radius: 26px;
      padding: 10px 22px;
      font-size: 1.25rem;
      color: var(--charcoal);
      box-shadow: 3px 4px 0px rgba(0, 0, 0, 0.15);
      margin-bottom: 14px;
      position: relative;
      animation: floatBubble 3s ease-in-out infinite;
      cursor: pointer;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .speech-bubble:active {
      transform: scale(0.96);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 11px 11px 0;
      border-style: solid;
      border-color: var(--charcoal) transparent transparent;
      display: block;
      width: 0;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 9px 0;
      border-style: solid;
      border-color: var(--card-bg) transparent transparent;
      display: block;
      width: 0;
      z-index: 1;
    }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .cat-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }
    .cat-wrapper:active {
      transform: scale(0.97);
    }

    .cat-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(2px 5px 3px rgba(0, 0, 0, 0.12));
    }

    .cat-wrapper.petting {
      animation: catWiggle 0.5s ease-in-out infinite alternate;
    }
    @keyframes catWiggle {
      0% { transform: rotate(-3deg) scale(1.02); }
      100% { transform: rotate(3deg) scale(1.02); }
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }

    .pet-btn, .shop-btn {
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 1.2rem;
      font-family: inherit;
      color: var(--charcoal);
      cursor: pointer;
      box-shadow: 2px 4px 0px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pet-btn:hover, .shop-btn:hover {
      transform: translateY(-2px);
      box-shadow: 2px 6px 0px rgba(0, 0, 0, 0.2);
    }
    .pet-btn:active, .shop-btn:active {
      transform: translateY(2px);
      box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.2);
    }

    /* Modais */
    .letter-modal, .shop-modal {
      position: fixed;
      inset: 0;
      background: rgba(20, 18, 16, 0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .letter-modal.open, .shop-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .letter-paper, .shop-paper {
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      padding: 38px 24px 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      position: relative;
      transform: translateY(25px) scale(0.92);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-height: 88vh;
      overflow-y: auto;
    }
    .letter-paper {
      background-image: repeating-linear-gradient(
        var(--card-bg),
        var(--card-bg) 27px,
        rgba(150, 140, 130, 0.25) 28px
      );
      line-height: 28px;
    }
    .letter-modal.open .letter-paper, .shop-modal.open .shop-paper {
      transform: translateY(0) scale(1);
    }

    .letter-stamp {
      position: absolute;
      top: 14px;
      right: 56px;
      width: 44px;
      height: 48px;
      border: 1.5px dashed var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transform: rotate(6deg);
      background: rgba(236, 210, 155, 0.15);
    }

    .letter-text {
      font-family: 'Caveat', cursive;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--charcoal);
      margin-bottom: 24px;
      white-space: pre-line;
      text-align: left;
    }

    .letter-footer {
      font-family: 'Patrick Hand', cursive;
      font-size: 1.15rem;
      color: var(--pencil-light);
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      border-top: 1px dashed var(--amber);
      padding-top: 12px;
    }

    /* Botão X de Fechar Totalmente Acessível */
    .close-modal-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--charcoal);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 1px 2px 0 rgba(0,0,0,0.2);
      z-index: 20;
    }
    .close-modal-btn:hover {
      background: #f1e4d0;
      transform: scale(1.05);
    }

    /* Lojinha & Backup */
    .shop-title {
      font-family: 'Caveat', cursive;
      font-size: 2.1rem;
      text-align: center;
      margin-bottom: 4px;
    }
    .shop-subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: var(--pencil-light);
      margin-bottom: 14px;
    }
    .shop-section-title {
      font-size: 1.1rem;
      margin: 14px 0 8px;
      color: var(--amber);
      border-bottom: 1px dashed rgba(150, 140, 130, 0.4);
      padding-bottom: 4px;
    }
    .shop-items-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .shop-card {
      border: 1.5px solid var(--charcoal);
      border-radius: 12px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.03);
    }
    .shop-card-icon {
      font-size: 1.8rem;
      margin-bottom: 2px;
    }
    .shop-card-name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1px;
    }
    .shop-card-price {
      font-size: 0.88rem;
      color: var(--amber);
      margin-bottom: 6px;
    }
    .item-action-btn {
      width: 100%;
      padding: 6px;
      border-radius: 14px;
      border: 1.5px solid var(--charcoal);
      background: var(--card-bg);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--charcoal);
    }
    .item-action-btn.equipped {
      background: var(--amber);
      color: #fff;
    }

    /* Painel de Backup */
    .backup-panel {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .backup-btn {
      flex: 1;
      padding: 8px;
      border: 1.5px solid var(--charcoal);
      border-radius: 12px;
      background: var(--card-bg);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--charcoal);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 1px 2px 0 rgba(0,0,0,0.1);
    }
    .backup-btn:hover {
      background: #faf4e6;
    }

    .daily-toast {
      position: fixed;
      bottom: 24px;
      background: var(--card-bg);
      border: 2px solid var(--charcoal);
      border-radius: 20px;
      padding: 10px 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      font-size: 1.15rem;
      z-index: 150;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .daily-toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <!-- Controles Superiores -->
  <div class="top-controls">
    <button class="auto-time-toggle" id="auto-time-btn" onclick="toggleAutoTime()">
      <span id="auto-time-icon">⏰</span>
      <span id="auto-time-text">Tema Auto: ON</span>
    </button>
    <div class="coin-badge" onclick="openShop()">
      <span>🐟</span>
      <span id="coin-counter">0</span>
    </div>
  </div>

  <div class="daily-toast" id="daily-toast">
    🎁 Você ganhou sua moeda diária! (+1 🐟)
  </div>

  <!-- Gatinhos espiando nas bordas -->
  <div class="border-peeker left" id="peeker-left">
    <svg width="70" height="60" viewBox="0 0 100 80">
      <path d="M 16,80 L 16,42 L 6,18 L 40,32 Q 50,35 60,32 L 94,18 L 84,42 L 84,80 Z"
            fill="#fffdf9" stroke="#2b2725" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="37" cy="55" r="14" fill="#2b2725"/>
      <circle cx="67" cy="55" r="14" fill="#2b2725"/>
      <circle cx="41" cy="49" r="4.2" fill="#ffffff"/>
      <circle cx="71" cy="49" r="4.2" fill="#ffffff"/>
      <path d="M 49,69 Q 52,72 55,69" fill="none" stroke="#2b2725" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="border-peeker right" id="peeker-right">
    <svg width="70" height="60" viewBox="0 0 100 80">
      <path d="M 16,80 L 16,42 L 6,18 L 40,32 Q 50,35 60,32 L 94,18 L 84,42 L 84,80 Z"
            fill="#fffdf9" stroke="#2b2725" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="37" cy="55" r="14" fill="#2b2725"/>
      <circle cx="67" cy="55" r="14" fill="#2b2725"/>
      <circle cx="41" cy="49" r="4.2" fill="#ffffff"/>
      <circle cx="71" cy="49" r="4.2" fill="#ffffff"/>
      <path d="M 49,69 Q 52,72 55,69" fill="none" stroke="#2b2725" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="border-peeker bottom" id="peeker-bottom">
    <svg width="70" height="60" viewBox="0 0 100 80">
      <path d="M 16,80 L 16,42 L 6,18 L 40,32 Q 50,35 60,32 L 94,18 L 84,42 L 84,80 Z"
            fill="#fffdf9" stroke="#2b2725" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="37" cy="55" r="14" fill="#2b2725"/>
      <circle cx="67" cy="55" r="14" fill="#2b2725"/>
      <circle cx="41" cy="49" r="4.2" fill="#ffffff"/>
      <circle cx="71" cy="49" r="4.2" fill="#ffffff"/>
      <path d="M 49,69 Q 52,72 55,69" fill="none" stroke="#2b2725" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <main class="stage">
    <div class="speech-bubble" id="speech-bubble" onclick="openLetter()">
      Psst... toque no gatinho para abrir a cartinha!🐾
    </div>

    <div class="cat-wrapper" id="cat-wrapper" onclick="openLetter()">
      <svg class="cat-svg" viewBox="0 0 200 200">
        <defs>
          <clipPath id="left-eye-clip">
            <ellipse cx="68" cy="98" rx="26" ry="24"/>
          </clipPath>
          <clipPath id="right-eye-clip">
            <ellipse cx="122" cy="98" rx="26" ry="24"/>
          </clipPath>
        </defs>

        <!-- Cauda -->
        <path d="M 136,155 C 165,152 178,130 170,118 C 163,108 152,118 150,126 C 148,135 140,147 132,154" 
              fill="none" stroke="#2b2725" stroke-width="4" stroke-linecap="round"/>

        <!-- Corpo e patinhas traseiras -->
        <path d="M 64,136 C 58,150 56,168 68,172 C 78,175 84,164 88,152 C 94,152 104,152 110,152 C 114,164 120,175 130,172 C 142,168 140,150 134,136 Z" 
              fill="#fffdf9" stroke="#2b2725" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- Cabeça -->
        <path d="M 44,82 C 40,54 44,38 52,42 C 64,48 82,70 98,70 C 114,70 132,48 144,42 C 152,38 156,54 152,82 C 160,112 142,138 98,138 C 54,138 36,112 44,82 Z" 
              fill="#fffdf9" stroke="#2b2725" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- Olhos Regulares -->
        <g id="regular-eyes">
          <ellipse cx="68" cy="98" rx="26" ry="24" fill="#2b2725" stroke="#2b2725" stroke-width="2"/>
          <g clip-path="url(#left-eye-clip)">
            <path d="M 68,93 C 68,90 64,87 61,89 C 58,91 58,95 61,98 L 68,104 L 75,98 C 78,95 78,91 75,89 C 72,87 68,90 68,93 Z" fill="#ffffff"/>
            <circle cx="76" cy="103" r="2.8" fill="#ffffff"/>
          </g>

          <ellipse cx="122" cy="98" rx="26" ry="24" fill="#2b2725" stroke="#2b2725" stroke-width="2"/>
          <g clip-path="url(#right-eye-clip)">
            <path d="M 122,93 C 122,90 118,87 115,89 C 112,91 112,95 115,98 L 122,104 L 129,98 C 132,95 132,91 129,89 C 126,87 122,90 122,93 Z" fill="#ffffff"/>
            <circle cx="130" cy="103" r="2.8" fill="#ffffff"/>
          </g>

          <path d="M 94,116 Q 98,121 102,116" fill="none" stroke="#2b2725" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- Olhos de Carinho (^ ‿ ^) -->
        <g id="happy-eyes" style="display: none;">
          <path d="M 52,100 Q 68,82 84,100" fill="none" stroke="#2b2725" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 106,100 Q 122,82 138,100" fill="none" stroke="#2b2725" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 90,114 Q 95,123 99,117 Q 103,123 108,114" fill="none" stroke="#2b2725" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Patinhas apoiadas na barriga (quando não está segurando a carta) -->
        <g id="idle-paws" style="display: none;">
          <ellipse cx="80" cy="144" rx="7.5" ry="6.5" fill="#fffdf9" stroke="#2b2725" stroke-width="3"/>
          <ellipse cx="116" cy="144" rx="7.5" ry="6.5" fill="#fffdf9" stroke="#2b2725" stroke-width="3"/>
        </g>

        <!-- Envelope Fechado (segurado pelo gato 1 vez por período) -->
        <g id="cat-letter-group">
          <rect x="70" y="130" width="56" height="38" rx="4" fill="#fffdf9" stroke="#2b2725" stroke-width="3.5"/>
          <path d="M 70,132 L 98,150 L 126,132" fill="none" stroke="#2b2725" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 70,166 L 90,146" fill="none" stroke="#2b2725" stroke-width="2"/>
          <path d="M 126,166 L 106,146" fill="none" stroke="#2b2725" stroke-width="2"/>
          <path d="M 98,145 C 98,143 96,141 94,142 C 92,143 92,145 94,147 L 98,151 L 102,147 C 104,145 104,143 102,142 C 100,141 98,143 98,145 Z" 
                fill="#c48b36" stroke="#2b2725" stroke-width="1.5"/>
          <!-- Patinhas segurando o envelope -->
          <ellipse cx="69" cy="144" rx="7.5" ry="6.5" fill="#fffdf9" stroke="#2b2725" stroke-width="3"/>
          <ellipse cx="127" cy="144" rx="7.5" ry="6.5" fill="#fffdf9" stroke="#2b2725" stroke-width="3"/>
        </g>

        <!-- ================= COSMÉTICOS DO GATO ================= -->
        <!-- Gravatinha Borboleta (Posicionada acima, visível com ou sem a carta) -->
        <g id="cosmetic-bowtie" style="display: none;">
          <polygon points="85,124 85,138 96,131" fill="#2b2725" stroke="#2b2725" stroke-width="2"/>
          <polygon points="111,124 111,138 100,131" fill="#2b2725" stroke="#2b2725" stroke-width="2"/>
          <circle cx="98" cy="131" r="3.5" fill="#c48b36"/>
        </g>

        <!-- Óculos -->
        <g id="cosmetic-glasses" style="display: none;">
          <circle cx="68" cy="98" r="24" fill="none" stroke="#2b2725" stroke-width="3"/>
          <circle cx="122" cy="98" r="24" fill="none" stroke="#2b2725" stroke-width="3"/>
          <path d="M 92,98 Q 95,94 98,98" fill="none" stroke="#2b2725" stroke-width="3"/>
        </g>

        <!-- Florzinha -->
        <g id="cosmetic-flower" style="display: none;">
          <circle cx="48" cy="48" r="6" fill="#fffdf9" stroke="#2b2725" stroke-width="2.5"/>
          <circle cx="58" cy="42" r="6" fill="#fffdf9" stroke="#2b2725" stroke-width="2.5"/>
          <circle cx="64" cy="52" r="6" fill="#fffdf9" stroke="#2b2725" stroke-width="2.5"/>
          <circle cx="56" cy="60" r="6" fill="#fffdf9" stroke="#2b2725" stroke-width="2.5"/>
          <circle cx="46" cy="56" r="6" fill="#fffdf9" stroke="#2b2725" stroke-width="2.5"/>
          <circle cx="54" cy="52" r="4.5" fill="#c48b36" stroke="#2b2725" stroke-width="2"/>
        </g>

        <!-- Coroa -->
        <g id="cosmetic-crown" style="display: none;">
          <path d="M 80,48 L 86,60 L 98,42 L 110,60 L 116,48 L 114,64 L 82,64 Z" 
                fill="#ecd29b" stroke="#2b2725" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="98" cy="42" r="2.5" fill="#c48b36"/>
        </g>
      </svg>
    </div>

    <!-- Linha de Ações -->
    <div class="action-row">
      <button class="pet-btn" id="pet-btn" onclick="petTheCat(event)">
        <span>Acariciar</span> 🐾
      </button>
      <button class="shop-btn" onclick="openShop()">
        <span>Lojinha</span> 🐟
      </button>
    </div>
  </main>

  <!-- Modal da Carta Aberta -->
  <div class="letter-modal" id="letter-modal">
    <div class="letter-paper">
      <!-- Botão de Fechar ✕ Totalmente funcional e acessível -->
      <button class="close-modal-btn" onclick="closeLetter()" aria-label="Fechar">✕</button>
      <div class="letter-stamp">💌</div>
      <div class="letter-text" id="letter-content"></div>
      <div class="letter-footer">
        Com todo o meu amor, para você ♡
      </div>
    </div>
  </div>

  <!-- Modal da Lojinha -->
  <div class="shop-modal" id="shop-modal">
    <div class="shop-paper">
      <button class="close-modal-btn" onclick="closeShop()" aria-label="Fechar">✕</button>
      <h2 class="shop-title">Lojinha & Cosméticos 🐟</h2>
      <p class="shop-subtitle">Use suas moedas diárias para personalizar tudo!</p>

      <div class="shop-section-title">Acessórios do Gatinho</div>
      <div class="shop-items-grid" id="shop-accessories-grid"></div>

      <div class="shop-section-title">Paletas de Cores do Site</div>
      <div class="shop-items-grid" id="shop-themes-grid"></div>

      <div class="shop-section-title">Efeitos de Carinho</div>
      <div class="shop-items-grid" id="shop-effects-grid"></div>

      <!-- Backup e Restauração de Dados -->
      <div class="shop-section-title">Dados & Backup 💾</div>
      <div class="backup-panel">
        <button class="backup-btn" onclick="exportDataBackup()">📥 Salvar Backup</button>
        <button class="backup-btn" onclick="document.getElementById('import-file-input').click()">📤 Restaurar</button>
        <input type="file" id="import-file-input" style="display: none;" accept=".json" onchange="importDataBackup(event)">
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1. CONTROLE DE PERÍODO E ENTREGA DA CARTA
    ========================================================= */
    function getCurrentPeriodKey() {
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const hour = now.getHours();
      let period = "dawn";
      if (hour >= 5 && hour < 12) period = "morning";
      else if (hour >= 12 && hour < 18) period = "afternoon";
      else if (hour >= 18 && hour < 24) period = "evening";
      return `${dateStr}_${period}`;
    }

    function updateLetterHoldingState() {
      const currentPeriod = getCurrentPeriodKey();
      const lastOpenedPeriod = localStorage.getItem('cat_last_opened_period');
      const letterGroup = document.getElementById('cat-letter-group');
      const idlePaws = document.getElementById('idle-paws');
      const bubble = document.getElementById('speech-bubble');

      // Se ainda não abriu a carta deste período, o gato segura o envelope
      if (lastOpenedPeriod !== currentPeriod) {
        letterGroup.style.display = 'block';
        idlePaws.style.display = 'none';
        bubble.innerText = "Psst... o gatinho trouxe uma cartinha para você! 🐾";
      } else {
        // Já abriu neste período: gato solta a carta
        letterGroup.style.display = 'none';
        idlePaws.style.display = 'block';
        bubble.innerText = "Toque no gatinho para reler a cartinha! 💌";
      }
    }

    /* =========================================================
       2. TEMA AUTOMÁTICO CONFORME O HORÁRIO
    ========================================================= */
    let autoTimeEnabled = localStorage.getItem('cat_auto_time') !== 'false';

    function updateTimeTheme() {
      if (!autoTimeEnabled) return;

      const hour = new Date().getHours();
      document.body.classList.remove('time-morning', 'time-afternoon', 'time-evening', 'time-dawn', 'theme-cafe', 'theme-night');

      let periodLabel = "";
      if (hour >= 5 && hour < 12) {
        document.body.classList.add('time-morning');
        periodLabel = "Manhã ☀️";
      } else if (hour >= 12 && hour < 18) {
        document.body.classList.add('time-afternoon');
        periodLabel = "Tarde 🌇";
      } else if (hour >= 18 && hour < 24) {
        document.body.classList.add('time-evening');
        periodLabel = "Noite 🌙";
      } else {
        document.body.classList.add('time-dawn');
        periodLabel = "Madrugada 🌌";
      }

      document.getElementById('auto-time-text').innerText = `Auto: ${periodLabel}`;
    }

    function toggleAutoTime() {
      autoTimeEnabled = !autoTimeEnabled;
      localStorage.setItem('cat_auto_time', autoTimeEnabled);

      const btn = document.getElementById('auto-time-btn');
      if (autoTimeEnabled) {
        btn.classList.add('active');
        updateTimeTheme();
      } else {
        btn.classList.remove('active');
        document.body.classList.remove('time-morning', 'time-afternoon', 'time-evening', 'time-dawn');
        document.getElementById('auto-time-text').innerText = "Auto: OFF";
        applyManualTheme();
      }
    }

    /* =========================================================
       3. LOJINHA, ITENS E BACKUP
    ========================================================= */
    const SHOP_CONFIG = {
      accessories: [
        { id: 'bowtie', name: 'Gravatinha', price: 1, icon: '🎀', elId: 'cosmetic-bowtie' },
        { id: 'glasses', name: 'Óculos', price: 2, icon: '👓', elId: 'cosmetic-glasses' },
        { id: 'flower', name: 'Florzinha', price: 3, icon: '🌸', elId: 'cosmetic-flower' },
        { id: 'crown', name: 'Coroa', price: 4, icon: '👑', elId: 'cosmetic-crown' }
      ],
      themes: [
        { id: 'theme_default', name: 'Pergaminho', price: 0, icon: '📜', class: '' },
        { id: 'theme_cafe', name: 'Carvão & Café', price: 3, icon: '☕', class: 'theme-cafe' },
        { id: 'theme_night', name: 'Noite Estrelada', price: 5, icon: '🌌', class: 'theme-night' }
      ],
      effects: [
        { id: 'fx_hearts', name: 'Corações', price: 0, icon: '🤍', type: 'heart' },
        { id: 'fx_leaves', name: 'Folhas de Outono', price: 2, icon: '🍂', type: 'leaf' },
        { id: 'fx_stars', name: 'Estrelinhas', price: 3, icon: '✨', type: 'star' }
      ]
    };

    let userCoins = parseInt(localStorage.getItem('cat_coins') || '0', 10);
    let unlockedItems = JSON.parse(localStorage.getItem('cat_unlocked') || '["theme_default", "fx_hearts"]');
    let equippedItems = JSON.parse(localStorage.getItem('cat_equipped') || '["fx_hearts"]');
    let activeTheme = localStorage.getItem('cat_active_theme') || 'theme_default';
    let activeEffect = localStorage.getItem('cat_active_effect') || 'heart';

    function saveState() {
      localStorage.setItem('cat_coins', userCoins);
      localStorage.setItem('cat_unlocked', JSON.stringify(unlockedItems));
      localStorage.setItem('cat_equipped', JSON.stringify(equippedItems));
      localStorage.setItem('cat_active_theme', activeTheme);
      localStorage.setItem('cat_active_effect', activeEffect);
      document.getElementById('coin-counter').innerText = userCoins;
      applyEquippedCosmetics();
      if (!autoTimeEnabled) applyManualTheme();
    }

    function checkDailyReward() {
      const today = new Date().toDateString();
      const lastClaim = localStorage.getItem('cat_last_reward_date');

      if (lastClaim !== today) {
        userCoins += 1;
        localStorage.setItem('cat_last_reward_date', today);
        saveState();

        setTimeout(() => {
          const toast = document.getElementById('daily-toast');
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 3500);
        }, 800);
      } else {
        saveState();
      }
    }

    function applyManualTheme() {
      document.body.classList.remove('theme-cafe', 'theme-night');
      const found = SHOP_CONFIG.themes.find(t => t.id === activeTheme);
      if (found && found.class) {
        document.body.classList.add(found.class);
      }
    }

    function applyEquippedCosmetics() {
      SHOP_CONFIG.accessories.forEach(item => {
        const el = document.getElementById(item.elId);
        if (el) el.style.display = equippedItems.includes(item.id) ? 'block' : 'none';
      });
    }

    function renderShopSection(containerId, items, currentSelector, onSelect) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      items.forEach(item => {
        const isUnlocked = unlockedItems.includes(item.id);
        const isSelected = currentSelector(item);

        const card = document.createElement('div');
        card.className = 'shop-card';

        let btnText = isUnlocked ? (isSelected ? 'Equipado ✓' : 'Usar') : `Comprar (${item.price} 🐟)`;
        let btnClass = `item-action-btn ${isSelected ? 'equipped' : ''}`;

        card.innerHTML = `
          <div class="shop-card-icon">${item.icon}</div>
          <div class="shop-card-name">${item.name}</div>
          <div class="shop-card-price">${isUnlocked ? 'Disponível' : `${item.price} peixinho(s)`}</div>
          <button class="${btnClass}">${btnText}</button>
        `;

        card.querySelector('button').onclick = () => onSelect(item);
        container.appendChild(card);
      });
    }

    function renderShop() {
      renderShopSection('shop-accessories-grid', SHOP_CONFIG.accessories, 
        item => equippedItems.includes(item.id),
        item => {
          if (unlockedItems.includes(item.id)) {
            equippedItems = equippedItems.includes(item.id) ? equippedItems.filter(id => id !== item.id) : [...equippedItems, item.id];
          } else if (userCoins >= item.price) {
            userCoins -= item.price;
            unlockedItems.push(item.id);
            equippedItems.push(item.id);
            playPaperSound();
          } else {
            alert('Você ainda não tem peixinhos suficientes! Volte amanhã para ganhar mais 🐟');
            return;
          }
          saveState();
          renderShop();
        }
      );

      renderShopSection('shop-themes-grid', SHOP_CONFIG.themes,
        item => activeTheme === item.id,
        item => {
          if (unlockedItems.includes(item.id)) {
            activeTheme = item.id;
            if (autoTimeEnabled) toggleAutoTime();
          } else if (userCoins >= item.price) {
            userCoins -= item.price;
            unlockedItems.push(item.id);
            activeTheme = item.id;
            if (autoTimeEnabled) toggleAutoTime();
            playPaperSound();
          } else {
            alert('Você ainda não tem peixinhos suficientes! Volte amanhã para ganhar mais 🐟');
            return;
          }
          saveState();
          renderShop();
        }
      );

      renderShopSection('shop-effects-grid', SHOP_CONFIG.effects,
        item => activeEffect === item.type,
        item => {
          if (unlockedItems.includes(item.id)) {
            activeEffect = item.type;
          } else if (userCoins >= item.price) {
            userCoins -= item.price;
            unlockedItems.push(item.id);
            activeEffect = item.type;
            playPaperSound();
          } else {
            alert('Você ainda não tem peixinhos suficientes! Volte amanhã para ganhar mais 🐟');
            return;
          }
          saveState();
          renderShop();
        }
      );
    }

    function openShop() {
      renderShop();
      document.getElementById('shop-modal').classList.add('open');
    }

    function closeShop() {
      document.getElementById('shop-modal').classList.remove('open');
    }

    document.getElementById('shop-modal').addEventListener('click', (e) => {
      if (e.target.id === 'shop-modal') closeShop();
    });

    /* =========================================================
       4. BACKUP EM ARQUIVO JSON
    ========================================================= */
    function exportDataBackup() {
      const backupData = {
        cat_coins: userCoins,
        cat_unlocked: unlockedItems,
        cat_equipped: equippedItems,
        cat_active_theme: activeTheme,
        cat_active_effect: activeEffect,
        cat_last_reward_date: localStorage.getItem('cat_last_reward_date'),
        cat_last_opened_period: localStorage.getItem('cat_last_opened_period'),
        backup_date: new Date().toISOString()
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "backup_gatinho.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importDataBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.cat_coins !== undefined) userCoins = data.cat_coins;
          if (Array.isArray(data.cat_unlocked)) unlockedItems = data.cat_unlocked;
          if (Array.isArray(data.cat_equipped)) equippedItems = data.cat_equipped;
          if (data.cat_active_theme) activeTheme = data.cat_active_theme;
          if (data.cat_active_effect) activeEffect = data.cat_active_effect;
          if (data.cat_last_reward_date) localStorage.setItem('cat_last_reward_date', data.cat_last_reward_date);
          if (data.cat_last_opened_period) localStorage.setItem('cat_last_opened_period', data.cat_last_opened_period);

          saveState();
          updateLetterHoldingState();
          renderShop();
          alert('Backup restaurado com sucesso! Seus dados e moedas voltaram.');
        } catch (err) {
          alert('Erro ao carregar o arquivo de backup. Verifique se é um arquivo .json válido.');
        }
      };
      reader.readAsText(file);
    }

    /* =========================================================
       5. SAUDAÇÃO DINÂMICA
    ========================================================= */
    function getDynamicGreeting() {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 12) return "Bom dia";
      if (hour >= 12 && hour < 18) return "Boa tarde";
      if (hour >= 18 && hour < 24) return "Boa noite";
      return "Boa madrugada";
    }

    function buildLetterText() {
      const greeting = getDynamicGreeting();
      return `Adoro o seu jeitinho. Seu sorriso me contagia de alegria.\n\n${greeting}, meu pedaço de pecado, te amo!`;
    }

    /* =========================================================
       6. REPRODUÇÃO DE ÁUDIO
    ========================================================= */
    let catAudio = null;
    try {
      catAudio = new Audio('gato_1.mp3');
    } catch(e) {
      catAudio = null;
    }

    let audioCtx = null;
    function playSynthesizedMeow() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'triangle';
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1600, now);

        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.16);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.55);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.6);
      } catch (err) {}
    }

    function playMeowSound() {
      if (catAudio) {
        catAudio.currentTime = 0;
        catAudio.play().catch(() => playSynthesizedMeow());
      } else {
        playSynthesizedMeow();
      }
    }

    function playPaperSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1200;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(now);
      } catch(e) {}
    }

    /* =========================================================
       7. INTERAÇÕES: ABRIR CARTA E CARINHO
    ========================================================= */
    const letterModal = document.getElementById('letter-modal');
    const letterContent = document.getElementById('letter-content');
    const catWrapper = document.getElementById('cat-wrapper');
    const regularEyes = document.getElementById('regular-eyes');
    const happyEyes = document.getElementById('happy-eyes');

    function openLetter() {
      letterContent.innerText = buildLetterText();
      playPaperSound();
      letterModal.classList.add('open');
      createFloatingParticles(window.innerWidth / 2, window.innerHeight / 2, 12);

      // Marca o período atual como aberto e faz o gato soltar a carta
      const currentPeriod = getCurrentPeriodKey();
      localStorage.setItem('cat_last_opened_period', currentPeriod);
      updateLetterHoldingState();
    }

    function closeLetter() {
      letterModal.classList.remove('open');
    }

    letterModal.addEventListener('click', (e) => {
      if (e.target.id === 'letter-modal') closeLetter();
    });

    let petTimeout = null;
    function petTheCat(event) {
      event.stopPropagation();
      playMeowSound();

      regularEyes.style.display = 'none';
      happyEyes.style.display = 'block';
      catWrapper.classList.add('petting');

      const rect = catWrapper.getBoundingClientRect();
      createFloatingParticles(rect.left + rect.width / 2, rect.top + 50, 6);

      clearTimeout(petTimeout);
      petTimeout = setTimeout(() => {
        regularEyes.style.display = 'block';
        happyEyes.style.display = 'none';
        catWrapper.classList.remove('petting');
      }, 1000);
    }

    /* =========================================================
       8. RASTROS DE PATINHAS E PARTÍCULAS
    ========================================================= */
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const paws = [];
    const particles = [];

    function drawPaw(x, y, angle, alpha, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale, scale);
      ctx.fillStyle = `rgba(100, 90, 80, ${alpha * 0.5})`;

      ctx.beginPath();
      ctx.ellipse(0, 0, 7.5, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      const toes = [
        { dx: -7.5, dy: -8.5, r: 2.8 },
        { dx: -2.8, dy: -11.5, r: 3.2 },
        { dx: 3.2, dy: -11.5, r: 3.2 },
        { dx: 7.8, dy: -8.5, r: 2.8 }
      ];
      toes.forEach(t => {
        ctx.beginPath();
        ctx.arc(t.dx, t.dy, t.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function createFloatingParticles(x, y, count = 5) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() * 40 - 20),
          y: y + (Math.random() * 20 - 10),
          vx: Math.random() * 2 - 1,
          vy: -(Math.random() * 2 + 1.5),
          size: Math.random() * 12 + 10,
          alpha: 0.9,
          decay: Math.random() * 0.015 + 0.012,
          type: activeEffect
        });
      }
    }

    function drawParticle(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = p.alpha;

      if (p.type === 'heart') {
        ctx.fillStyle = '#c48b36';
        ctx.beginPath();
        const topH = p.size * 0.3;
        ctx.moveTo(0, topH);
        ctx.bezierCurveTo(0, 0, -p.size/2, 0, -p.size/2, topH);
        ctx.bezierCurveTo(-p.size/2, (p.size+topH)/2, 0, p.size, 0, p.size);
        ctx.bezierCurveTo(0, p.size, p.size/2, (p.size+topH)/2, p.size/2, topH);
        ctx.bezierCurveTo(p.size/2, 0, 0, 0, 0, topH);
        ctx.fill();
      } else if (p.type === 'leaf') {
        ctx.fillStyle = '#a86c2e';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 0.4, p.size * 0.8, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'star') {
        ctx.fillStyle = '#d89f4b';
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          ctx.lineTo(p.size * 0.7, 0);
          ctx.lineTo(p.size * 0.2, p.size * 0.2);
        }
        ctx.fill();
      }

      ctx.restore();
    }

    class PawTrail {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.angle = Math.random() * Math.PI * 2;
        this.stepsLeft = Math.floor(Math.random() * 5) + 4;
        this.stepDist = 24;
        this.side = 1;
        this.delay = Math.random() * 60;
      }
      step() {
        if (this.delay > 0) { this.delay--; return; }
        const px = this.x + Math.cos(this.angle + Math.PI / 2) * (8 * this.side);
        const py = this.y + Math.sin(this.angle + Math.PI / 2) * (8 * this.side);

        paws.push({ x: px, y: py, angle: this.angle + Math.PI / 2, alpha: 0.38, scale: 0.9 + Math.random() * 0.2 });

        this.x += Math.cos(this.angle) * this.stepDist;
        this.y += Math.sin(this.angle) * this.stepDist;
        this.angle += (Math.random() * 0.4 - 0.2);
        this.side *= -1;
        this.stepsLeft--;
        this.delay = 18;

        if (this.stepsLeft <= 0 || this.x < -50 || this.x > window.innerWidth + 50 || this.y < -50 || this.y > window.innerHeight + 50) {
          this.reset();
        }
      }
    }

    const trails = [new PawTrail(), new PawTrail(), new PawTrail()];

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      trails.forEach(t => t.step());

      for (let i = paws.length - 1; i >= 0; i--) {
        const p = paws[i];
        drawPaw(p.x, p.y, p.angle, p.alpha, p.scale);
        p.alpha -= 0.0035;
        if (p.alpha <= 0) paws.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        drawParticle(pt);
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= pt.decay;
        if (pt.alpha <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }
    animate();

    /* =========================================================
       9. GATINHOS ESPIANDO NAS BORDAS
    ========================================================= */
    const peekers = [
      document.getElementById('peeker-left'),
      document.getElementById('peeker-right'),
      document.getElementById('peeker-bottom')
    ];

    function triggerRandomPeeker() {
      const p = peekers[Math.floor(Math.random() * peekers.length)];
      p.classList.add('active');
      setTimeout(() => {
        p.classList.remove('active');
      }, 2600);
      setTimeout(triggerRandomPeeker, Math.random() * 4500 + 3500);
    }
    setTimeout(triggerRandomPeeker, 2000);

    /* Inicializações */
    checkDailyReward();
    updateLetterHoldingState();

    if (autoTimeEnabled) {
      document.getElementById('auto-time-btn').classList.add('active');
      updateTimeTheme();
      setInterval(() => {
        updateTimeTheme();
        updateLetterHoldingState();
      }, 60000);
    } else {
      document.getElementById('auto-time-btn').classList.remove('active');
      document.getElementById('auto-time-text').innerText = "Auto: OFF";
      applyManualTheme();
    }
  </script>
</body>
</html>
